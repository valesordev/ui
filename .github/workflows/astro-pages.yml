name: Deploy Astro to GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use for the build
        type: string
        default: '22'
        required: false
      faro-apps:
        description: >-
          JSON map of hostname -> Grafana Faro app key, e.g.
          {"example.com":"abc...","example.solo7.valesordev.com":"def..."}.
          One build serves both GitHub Pages and the local cluster, and each has
          its own Faro app with CORS locked to its own origin, so the site picks
          the key at runtime by hostname. App keys ship to the browser and are
          not secrets, so this is an input rather than a secret — but callers
          should still pass it from a repo variable to keep keys out of source.
        type: string
        default: ''
        required: false
      faro-endpoint:
        description: Grafana Cloud Frontend Observability collector URL.
        type: string
        default: https://faro-collector-prod-us-central-0.grafana.net/collect
        required: false
    secrets:
      NODE_AUTH_TOKEN:
        description: >-
          Optional token for the GitHub Packages registry. Falls back to the
          run's own GITHUB_TOKEN, which is enough for a public package. Callers
          only need to pass one for a private package.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@valesordev'
      # setup-node writes //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}, so an
      # unset secret sends an EMPTY token — which GitHub Packages rejects with 401
      # even for a public package, where sending no token at all would succeed.
      # Falling back to the run's GITHUB_TOKEN avoids that: it is always present,
      # needs no PAT to rotate, and reads public packages fine.
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: npm run build
        env:
          # Absent or empty config makes the site's Faro init a graceful no-op,
          # so an un-migrated caller still builds and deploys fine.
          PUBLIC_FARO_APPS: ${{ inputs.faro-apps }}
          PUBLIC_FARO_ENDPOINT: ${{ inputs.faro-endpoint }}
          PUBLIC_FARO_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
