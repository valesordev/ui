name: Deploy Astro to GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use for the build
        type: string
        default: '22'
        required: false
      faro-apps:
        description: >-
          JSON map of hostname -> Grafana Faro app key, e.g.
          {"example.com":"abc...","example.solo7.valesordev.com":"def..."}.
          One build serves both GitHub Pages and the local cluster, and each has
          its own Faro app with CORS locked to its own origin, so the site picks
          the key at runtime by hostname. App keys ship to the browser and are
          not secrets, so this is an input rather than a secret — but callers
          should still pass it from a repo variable to keep keys out of source.
        type: string
        default: ''
        required: false
      faro-endpoint:
        description: Grafana Cloud Frontend Observability collector URL.
        type: string
        default: https://faro-collector-prod-us-central-0.grafana.net/collect
        required: false
    secrets:
      NODE_AUTH_TOKEN:
        description: >-
          Optional token for the GitHub Packages registry. Falls back to the
          run's own GITHUB_TOKEN, which is enough for a public package. Callers
          only need to pass one for a private package.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately no `registry-url`/`scope`. Those make setup-node write
      # //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} into ~/.npmrc, which
      # forces every request to the registry to carry a token — and GitHub
      # Packages rejects a token that lacks access to the package with 401 even
      # when the package is public. An unset secret sends an empty token; the
      # run's own GITHUB_TOKEN belongs to the consumer repo and has no grant on
      # valesordev/ui. Both 401.
      #
      # @valesordev/ui is public, and a public GitHub Packages npm package
      # downloads anonymously. Each consumer repo already has a committed
      # .npmrc mapping the @valesordev scope to the registry, which is all that
      # is needed. Sending no credentials is what actually works here.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm install
      - run: npm run build
        env:
          # Absent or empty config makes the site's Faro init a graceful no-op,
          # so an un-migrated caller still builds and deploys fine.
          PUBLIC_FARO_APPS: ${{ inputs.faro-apps }}
          PUBLIC_FARO_ENDPOINT: ${{ inputs.faro-endpoint }}
          PUBLIC_FARO_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
